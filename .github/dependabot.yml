# Avisa (com um pull request) quando sai correção de segurança ou versão nova de uma dependência.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # o remotion e o @remotion/player andam sempre na mesma versão: um pedido só para os dois
    groups:
      remotion:
        patterns:
          - "remotion"
          - "@remotion/*"
