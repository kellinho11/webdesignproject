<!doctype html>
<html lang="pt-BR" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #07090F; }
      #root { position: relative; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <!-- Teaser do SynapseQ (12 s): o criostato resfria e a câmera mergulha no chip; o título; o site
         rodando de verdade; a marca e o endereço. Uma cena por arquivo em compositions/. -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="12" data-width="1920" data-height="1080">
      <div id="frio" data-composition-id="frio" data-composition-src="compositions/frio.html" data-start="0" data-duration="2.9" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="titulo" data-composition-id="titulo" data-composition-src="compositions/titulo.html" data-start="2.8" data-duration="3.2" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="prova" data-composition-id="prova" data-composition-src="compositions/prova.html" data-start="6" data-duration="3.2" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="marca" data-composition-id="marca" data-composition-src="compositions/marca.html" data-start="9.2" data-duration="2.8" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
    </div>
    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
