<template>
  <style>
    @font-face { font-family: 'Sora'; src: url('assets/fonts/Sora-700.woff2') format('woff2'); font-weight: 700; }
    @font-face { font-family: 'Instrument Serif'; src: url('assets/fonts/InstrumentSerif-400-italic.woff2') format('woff2'); font-style: italic; }
    @font-face { font-family: 'JetBrains Mono'; src: url('assets/fonts/JetBrainsMono-500.woff2') format('woff2'); font-weight: 500; }
    #root { position: absolute; inset: 0; overflow: hidden; background: radial-gradient(ellipse 70% 60% at 50% 42%, #161236 0%, #07090F 72%); }
    #root .kick { position: absolute; left: 90px; top: 84px; margin: 0; font: 500 30px 'JetBrains Mono'; letter-spacing: 0.16em; text-transform: uppercase; color: #C9D8FF; }
    #root .kick b { font-weight: 500; color: #8B70FF; margin-right: 18px; }
    #root .say { position: absolute; left: 90px; right: 90px; bottom: 96px; margin: 0; font: 700 70px/1.04 'Sora'; letter-spacing: -0.045em; color: #FFFFFF; }
    #root .say em { font: italic 400 1.1em 'Instrument Serif'; letter-spacing: -0.02em; color: #C9D8FF; }
    #root .art { position: absolute; left: 0; right: 0; top: 150px; height: 600px; }

  </style>
  <div id="root" data-composition-id="superposicao" data-width="1080" data-height="1080">
    <p id="superposicao-kick" class="clip kick" data-start="0" data-duration="3.4" data-track-index="1"><b>02</b>Superposição</p>
    <div id="superposicao-art" class="clip art" data-start="0" data-duration="3.4" data-track-index="2">
      <svg id="sup-sph" viewBox="-200 -200 400 400" width="520" height="520" style="position:absolute;left:50%;top:50%;margin:-260px 0 0 -260px;overflow:visible">
        <circle r="160" fill="none" stroke="rgba(201,216,255,0.35)" stroke-width="2" />
        <ellipse rx="160" ry="44" fill="none" stroke="rgba(139,112,255,0.45)" stroke-width="2" stroke-dasharray="6 8" />
        <line x1="0" y1="-160" x2="0" y2="160" stroke="rgba(238,243,255,0.25)" stroke-width="2" stroke-dasharray="4 8" />
        <text x="0" y="-182" text-anchor="middle" font-family="JetBrains Mono" font-size="30" fill="#C9D8FF">|0⟩</text>
        <text x="0" y="206" text-anchor="middle" font-family="JetBrains Mono" font-size="30" fill="#C9D8FF">|1⟩</text>
        <line id="sup-line" x1="0" y1="0" x2="0" y2="-160" stroke="#C9D8FF" stroke-width="6" stroke-linecap="round" /><circle id="sup-tip" cx="0" cy="-160" r="12" fill="#FFFFFF" />
      </svg>
    </div>
    <p id="superposicao-say" class="clip say" data-start="0" data-duration="3.4" data-track-index="3"><span class="w">Um</span> <span class="w">qubit</span> <span class="w">é</span> <span class="w">0</span> <em class="w">e</em> <span class="w">1</span> <span class="w">ao</span> <span class="w">mesmo</span> <span class="w">tempo.</span></p>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    // entrada comum: o rótulo e a frase chegam palavra por palavra, sem deslizar
    tl.fromTo('#superposicao-kick', { opacity: 0, filter: 'blur(6px)' }, { opacity: 1, filter: 'blur(0px)', duration: 0.18, ease: 'power4.out' }, 0);
    tl.fromTo('#superposicao-say .w', { opacity: 0, filter: 'blur(6px)' }, { opacity: 1, filter: 'blur(0px)', duration: 0.13, ease: 'power4.out', stagger: 0.067 }, 0.25);
    tl.fromTo('#sup-sph', { scale: 0.7, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.5, ease: 'expo.out' }, 0.05);
    // precessão: o vetor sai do polo |0⟩, deita no equador e gira (0 e 1 ao mesmo tempo)
    // a ponta do vetor em coordenadas da esfera: θ desce do polo |0⟩ até o equador, φ gira em volta
    const v = { th: 0, ph: 0 };
    const place = () => {
      const x = 160 * Math.sin(v.th) * Math.cos(v.ph), y = -160 * Math.cos(v.th) + 44 * Math.sin(v.th) * Math.sin(v.ph);
      document.getElementById('sup-line').setAttribute('x2', x.toFixed(1)); document.getElementById('sup-line').setAttribute('y2', y.toFixed(1));
      document.getElementById('sup-tip').setAttribute('cx', x.toFixed(1)); document.getElementById('sup-tip').setAttribute('cy', y.toFixed(1));
    };
    tl.fromTo(v, { th: 0 }, { th: Math.PI / 2, duration: 0.7, ease: 'power2.inOut', onUpdate: place }, 0.5);
    tl.fromTo(v, { ph: 0 }, { ph: Math.PI * 3, duration: 2.4, ease: 'none', onUpdate: place }, 0.6);
    // saída: tudo some junto em 0,2 s antes do corte
    tl.fromTo('#superposicao-kick, #superposicao-art, #superposicao-say', { opacity: 1, filter: 'blur(0px)' }, { opacity: 0, filter: 'blur(8px)', duration: 0.2, ease: 'power3.in' }, 3.4 - 0.25);
    window.__timelines['superposicao'] = tl;
  </script>
</template>
